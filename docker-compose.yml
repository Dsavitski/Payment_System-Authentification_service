version: '3.8'

services:
  postgres-keycloak:
    image: postgres:16-alpine
    container_name: postgres-keycloak
    restart: always
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5433:5432"
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - payment-system-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.2
    container_name: keycloak
    command: start-dev
    restart: always
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    networks:
      - payment-system-network

  authentication-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: authentication-service
    restart: always
    depends_on:
      - keycloak
    environment:
      SERVER_PORT: 8085
      SPRING_PROFILES_ACTIVE: docker

      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: payment-system
      KEYCLOAK_CLIENT_ID: authentication-service
      KEYCLOAK_CLIENT_SECRET: bT9BYqOfyeztBQxmWs0zyAVFig9Uaqht
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      SERVICES_USER_SERVICE_URL: http://user-service:8082

      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/payment-system


    ports:
      - "8085:8085"
    networks:
      - payment-system-network

networks:
  payment-system-network:
    external: true
    name: payment-system-network

volumes:
  postgres_keycloak_data: